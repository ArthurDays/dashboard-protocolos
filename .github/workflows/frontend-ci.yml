name: Frontend CI

on:
  pull_request:
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/frontend-ci.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'package.json', 'package-lock.json', '.github/workflows/frontend-ci.yml']

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test, lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
