services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: protocolos
      POSTGRES_USER: protocolos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - protocolos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U protocolos -d protocolos"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://protocolos:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}@postgres:5432/protocolos
      PORT: 3333
      HOST: 0.0.0.0
      READ_API_KEY: ${READ_API_KEY:?Defina READ_API_KEY no arquivo .env}
      INGEST_API_KEY: ${INGEST_API_KEY:?Defina INGEST_API_KEY no arquivo .env}
      CORS_ORIGIN: http://127.0.0.1:5173
    ports:
      - "127.0.0.1:3333:3333"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      args:
        VITE_PROTOCOLS_API_URL: http://127.0.0.1:3333
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api

volumes:
  protocolos_pgdata:
